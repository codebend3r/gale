[workspace]
resolver = "2"
members = [
    "crates/gale_css_parser",
    "crates/gale_linter",
    "crates/gale_config",
    "crates/gale_cli",
    "crates/gale_formatter",
    "crates/gale_diagnostics",
    "crates/gale_lsp",
]

[workspace.package]
version = "0.2.5"
edition = "2024"
license = "MIT"
repository = "https://github.com/codebend3r/gale"
description = "An extremely fast CSS linter, written in Rust"

[workspace.dependencies]
# CSS Parsing
lightningcss = { version = "1.0.0-alpha.72", features = ["visitor", "serde"] }
raffia = "0.13.0"

# CLI & Config
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
toml = "1.1.7"

# Diagnostics & Output
miette = { version = "7.6.0", features = ["fancy"] }
owo-colors = "4.4.0"

# File discovery
glob = "0.3.4"
globset = "0.4.20"
ignore = "0.4.33"

# Performance
rayon = "1.12.0"
dashmap = "6.2.1"

# General
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Internal crates.
#
# These versions MUST track `workspace.package.version` above.  Cargo resolves a
# `version` requirement against crates.io when publishing, so leaving them behind
# means `cargo publish` builds the released binary against the last *published*
# member crates rather than this source tree — shipping stale rules under a new
# version number.  `cargo xtask`-free reminder: bump all of these together.
gale_css_parser = { path = "crates/gale_css_parser", version = "0.2.5" }
gale_linter = { path = "crates/gale_linter", version = "0.2.5" }
gale_config = { path = "crates/gale_config", version = "0.2.5" }
gale_cli = { path = "crates/gale_cli", version = "0.2.5" }
gale_formatter = { path = "crates/gale_formatter", version = "0.2.5" }
gale_diagnostics = { path = "crates/gale_diagnostics", version = "0.2.5" }
gale_lsp = { path = "crates/gale_lsp", version = "0.2.5" }

[package]
name = "gale-lint"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
# Only what this crate needs. Without a list, cargo packages the whole repo root,
# npm/bin binaries included, far past crates.io's 10 MB upload limit.
include = ["/src", "/README.md", "/LICENSE"]

[[bin]]
name = "gale"
path = "src/main.rs"

[dependencies]
gale_cli = { workspace = true }
anyhow = { workspace = true }
# Gale makes many small, short-lived allocations from every rayon worker;
# mimalloc handles that far better than the platform allocators.
mimalloc = { version = "0.1.52", default-features = false }

# Symbol tables are about a quarter of the binary and shipped binaries do
# not need them. Panic messages keep their file and line; only backtraces
# lose function names.
#
# Measured and left out (mimalloc build, load 40-130): thin LTO saves about
# 2.5% CPU, within noise, while doubling incremental release rebuilds;
# fat LTO and codegen-units = 1 show no consistent gain and double clean
# builds. `panic` must stay `unwind` so a panicking rule can be caught.
[profile.release]
strip = true
