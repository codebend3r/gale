name: 🧪 Pull request checks

on:
  pull_request:

# A new push to the same PR supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  build-binary:
    name: Build binary for the npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build gale
        run: cargo build --release

      - uses: actions/upload-artifact@v7
        with:
          name: gale-x86_64-unknown-linux-gnu
          path: target/release/gale
          if-no-files-found: error

  npm-package:
    name: npm package (Node ${{ matrix.node }})
    needs: build-binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every supported Node major: the oldest we accept via engines.node
        # through the version pinned in .nvmrc.
        node: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/download-artifact@v8
        with:
          name: gale-x86_64-unknown-linux-gnu
          path: artifact

      - name: Stage binary for the current platform
        run: install -Dm755 artifact/gale npm/bin/x86_64-unknown-linux-gnu/gale

      - name: Run programmatic API smoke tests
        run: node npm/test.mjs

      - name: Check the published file list
        run: npm pack --dry-run
        working-directory: npm

  feature-tests:
    name: Feature tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2

      - name: Build release
        run: cargo build --release

      - name: Run feature tests
        run: bun test tests/features

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2

      - name: Install hyperfine
        # Without it run-benchmark.sh silently degrades to `time`, whose output
        # is too noisy on shared runners to be worth reading.
        run: |
          sudo apt-get update
          sudo apt-get install -y hyperfine

      - name: Build release
        run: cargo build --release

      - name: Run benchmark
        run: bash benchmarks/run-benchmark.sh
