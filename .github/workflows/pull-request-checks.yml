name: 🧪 Pull request checks

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  npm-package:
    name: npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build gale
        run: cargo build --release

      - name: Stage binary for the current platform
        run: install -Dm755 target/release/gale npm/bin/x86_64-unknown-linux-gnu/gale

      - name: Run programmatic API smoke tests
        run: node npm/test.mjs

      - name: Check the published file list
        run: npm pack --dry-run
        working-directory: npm

  feature-tests:
    name: Feature tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2

      - name: Build release
        run: cargo build --release

      - name: Run feature tests
        run: bun test tests/features

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2

      - name: Install hyperfine
        # Without it run-benchmark.sh silently degrades to `time`, whose output
        # is too noisy on shared runners to be worth reading.
        run: |
          sudo apt-get update
          sudo apt-get install -y hyperfine

      - name: Build release
        run: cargo build --release

      - name: Run benchmark
        run: bash benchmarks/run-benchmark.sh
