name: 🧪 CI

# Pull requests and pushes to main run the same checks. Docs-only changes skip
# CI entirely; nothing they touch is built or tested.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes the run in flight. Every push to main
# gets its own run and verdict, keyed by commit, so none is cancelled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the hook config
        # A malformed lefthook.yml silently skips local checks, so catch it here.
        run: bunx lefthook validate

      - name: Build release
        # test:api and test:features both run the release binary.
        run: bun run build:release

      - name: Run the full test suite
        # cargo tests, npm API tests, and bun feature tests.
        run: bun run test

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2

      - name: Run clippy
        # The same command as the pre-commit hook: every target, warnings denied.
        run: bun run lint

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: oven-sh/setup-bun@v2

      - name: Check formatting
        run: bun run fmt:check

  build-binary:
    name: Build binary for the npm package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2

      - name: Build gale
        run: bun run build:release

      - uses: actions/upload-artifact@v7
        with:
          name: gale-x86_64-unknown-linux-gnu
          path: target/release/gale
          if-no-files-found: error

  npm-package:
    name: npm package (Node ${{ matrix.node }})
    needs: build-binary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Every supported Node major: the oldest we accept via engines.node
        # through the version pinned in .nvmrc.
        node: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/download-artifact@v8
        with:
          name: gale-x86_64-unknown-linux-gnu
          path: artifact

      - name: Stage binary for the current platform
        run: install -Dm755 artifact/gale npm/bin/x86_64-unknown-linux-gnu/gale

      - name: Run programmatic API smoke tests
        run: node npm/test.mjs

      - name: Check the published file list
        run: npm pack --dry-run
        working-directory: npm

  result:
    # One stable check to require in branch protection, and a verdict in the
    # run summary. Skipped only when the whole run is cancelled.
    name: CI result
    needs: [test, clippy, fmt, build-binary, npm-package]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r '[to_entries[] | select(.value.result != "success") | "\(.key) (\(.value.result))"] | join(", ")' <<<"$NEEDS")
          if [ -n "$failed" ]; then
            echo "💥 ${GITHUB_SHA:0:7} did not pass: $failed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ ${GITHUB_SHA:0:7} is clean: fmt, clippy, every test suite, and the npm package all green." >> "$GITHUB_STEP_SUMMARY"
